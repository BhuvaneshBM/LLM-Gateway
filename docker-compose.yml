services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: gw
      POSTGRES_DB: gateway
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on an empty volume -- creates the vector extension and schema.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gateway"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    env_file: .env
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Scheduler for the hourly cache reaper. Exactly ONE of these must run --
  # two beat processes double-schedule every periodic task.
  beat:
    build: .
    env_file: .env
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      redis: {condition: service_healthy}

volumes:
  pgdata:
